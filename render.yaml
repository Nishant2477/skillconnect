services:
  - type: web
    name: skillconnect-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REQUESTY_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://skillconnect-khaki.vercel.app
      - key: REQUESTY_MODEL
        value: google/gemma-4-31b-it